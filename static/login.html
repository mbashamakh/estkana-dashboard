<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estkana Dashboard — Login</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; background: #f4f5f7;
  }
  @media (prefers-color-scheme: dark) { body { background: #14161a; } }
  .card {
    background: #fff; border-radius: 12px; padding: 40px 36px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    width: 100%; max-width: 360px;
  }
  @media (prefers-color-scheme: dark) { .card { background: #1e2126; color: #e8e9eb; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #6b7280; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px;
  }
  @media (prefers-color-scheme: dark) { input { background: #14161a; border-color: #3a3f47; color: #e8e9eb; } }
  button {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: #dc2626; font-size: 13px; margin: -8px 0 16px; display: none; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Estkana Outlet Dashboard</h1>
    <p class="sub">Sign in with the email and password your admin gave you.</p>
    <div class="error" id="errorMsg"></div>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" id="submitBtn">Sign in</button>
  </form>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("errorMsg");
  errorEl.style.display = "none";
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || "Login failed");
    }
    window.location.href = "/";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
